[project]
name = "online-store-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Mikhail Loshakov",email = "kotov.mikhail.96@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.118.0)",
    "jinja2 (==3.1.6)",
    "uvicorn[standard] (==0.37.0)",
    "pydantic-settings (==2.11.0)"
]

[tool.poetry]
packages = [{include = "app", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)"
]

[tool.poetry.scripts]
start = "app.main:run"
